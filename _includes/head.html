<meta charset="UTF-8">
<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, user-scalable=no">
<title>{{ page.title | default: site.title }}</title>
<meta name="license" content="{{ site.url }}">

<!-- SEO Meta Tags -->
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="keywords" content="AI Quran, Islamic Assistant, Prayer Guide, Sholat, Quran">
<meta name="author" content="vildaesa">
<meta name="language" content="en, id">
<meta name="robots" content="index, follow">
<meta name="revisit-after" content="7 days">

<!-- Open Graph Meta Tags (Social Media Sharing) -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/og-image.png">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">

<!-- Twitter Card Meta Tags -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/images/og-image.png">
{% seo %}

<!-- Canonical URL -->
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Favicon -->
<link rel="icon" type="image/png" href="{{ '/favicon.ico' | relative_url }}">

<!-- Ionic Core 8 CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@8/css/ionic.bundle.css" />

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Noto+Naskh+Arabic:wght@400..700&display=swap" rel="stylesheet">

<!-- Custom Styles -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
