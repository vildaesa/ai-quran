<ion-header class="ion-no-border minimalist-header">
  <ion-toolbar class="minimalist-toolbar">
    <ion-buttons slot="start">
      <ion-menu-button menu="chatHistoryMenu" class="minimalist-btn"></ion-menu-button>
    </ion-buttons>
    
    <ion-title id="chat-title" class="minimalist-title">{{ page.title }}</ion-title>
    
    <ion-buttons slot="end">
      <!-- Tombol Buka Al-Quran Digital -->
      <ion-button id="open-quran-btn" fill="clear" class="minimalist-btn-quran">
        <ion-icon slot="icon-only" name="book-outline"></ion-icon>
      </ion-button>
      
      <ion-button id="clear-current-chat-btn" fill="clear" class="minimalist-btn-danger">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- MODAL AL-QURAN DIGITAL -->
<ion-modal id="quran-modal" trigger="open-quran-btn">
  <ion-header class="ion-no-border quran-modal-header">
    <ion-toolbar class="minimalist-toolbar">
      <ion-buttons slot="start">
        <ion-button id="quran-back-btn" fill="clear" class="quran-back-button" style="display: none;">
          <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
        </ion-button>
        <ion-button id="close-quran-btn" fill="clear" class="quran-close-btn">
          <ion-icon slot="icon-only" name="close-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
      
      <ion-title id="quran-modal-title" class="minimalist-title">Al-Quran Digital</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="quran-modal-content">
    
    <!-- VIEW 1: DAFTAR BUKU SURAH (GRID CARDS) -->
    <div id="quran-book-view" class="quran-book-wrapper">
      <div class="quran-book-header">
        <h3>Indeks Surah</h3>
        <p>Silakan ketuk salah satu surah untuk mulai membaca mushaf</p>
      </div>
      
      <div id="quran-surah-grid" class="quran-surah-grid">
        <div class="menu-loading-container" style="grid-column: 1/-1; padding: 60px 0;">
          <ion-spinner name="crescent" class="custom-spinner"></ion-spinner>
          <p style="margin-top: 12px; color: #718096;">Membuka lembaran mushaf...</p>
        </div>
      </div>
    </div>

    <!-- VIEW 2: HALAMAN BACAAN AYAT -->
    <div id="quran-reading-view" class="quran-reading-wrapper" style="display: none;">
      <div id="quran-verses-container" class="quran-verses-wrapper">
        <!-- Ayat suci akan dirender di sini oleh JS -->
      </div>
    </div>

  </ion-content>

<ion-footer id="quran-modal-footer" class="ion-no-border quran-mini-player-footer" style="display: none;">
  <div class="mini-player-container">
    <div class="mini-player-info">
      <span id="player-current-ayah" class="mini-player-subtext">Ketuk tombol putar...</span>
    </div>

    <div class="mini-player-controls">
      <ion-button fill="clear" id="quran-prev-btn" class="mini-control-btn">
        <ion-icon name="play-back-outline" slot="icon-only" class="force-visible"></ion-icon>
      </ion-button>

      <ion-button fill="clear" id="quran-play-all-btn" class="mini-control-btn play-main-btn">
        <ion-icon name="play-outline" id="play-all-icon" slot="icon-only" class="force-visible"></ion-icon>
      </ion-button>

      <ion-button fill="clear" id="quran-stop-btn" class="mini-control-btn stop-main-btn" style="display: none;">
        <ion-icon name="stop-outline" slot="icon-only" class="force-visible"></ion-icon>
      </ion-button>

      <ion-button fill="clear" id="quran-next-btn" class="mini-control-btn">
        <ion-icon name="play-forward-outline" slot="icon-only" class="force-visible"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-footer>
</ion-modal>

<style>
  /* --- GAYA MINIMALIS MODERN (LIGHT MODE) --- */
  /* Force Visibility Fix */
  .force-visible {
    visibility: visible !important;
    display: block !important;
    opacity: 1 !important;
    contain: none !important;
  }

  .mini-control-btn {
    --color: #2b6cb0;
    --background: transparent;
    --border-radius: 50%;
    width: 48px;
    height: 48px;
    margin: 0 4px;
    /* Memastikan tombol tidak tersembunyi */
    visibility: visible !important;
    display: flex !important;
    align-items: center;
    justify-content: center;
  }
  
  /* Hilangkan override tema yang mungkin menyembunyikan ikon */
  .mini-control-btn ion-icon {
    font-size: 24px !important;
    pointer-events: none;
  }
  .minimalist-header {
    --background: #ffffff;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06); 
  }

  .minimalist-toolbar {
    --background: transparent;
    --border-style: none;
    --padding-start: 12px;
    --padding-end: 12px;
    --min-height: 56px;
  }

  .minimalist-title {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.025em;
    color: #1a202c;
    text-align: center;
  }

  .minimalist-btn {
    --color: #4a5568;
    --background-hover: rgba(0, 0, 0, 0.04);
    --border-radius: 8px;
    margin: 4px;
    transition: all 0.2s ease-in-out;
  }

  .minimalist-btn-quran {
    --color: #2b6cb0;
    --background-hover: rgba(43, 108, 176, 0.06);
    --border-radius: 8px;
    margin: 4px;
    transition: all 0.2s ease-in-out;
  }

  .minimalist-btn-danger {
    --color: #e53e3e;
    --background-hover: rgba(229, 62, 62, 0.06);
    --border-radius: 8px;
    margin: 4px;
    transition: all 0.2s ease-in-out;
  }

  /* --- STYLING MODAL AL-QURAN (FULLSCREEN PREMIUM) --- */
  #quran-modal {
    --height: 100%;
    --width: 100%;
    --max-width: 760px;
    --border-radius: 16px 16px 0 0;
  }

  .quran-modal-header {
    --background: #f7fafc;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
  }

  .quran-close-btn, .quran-back-button {
    --color: #4a5568;
    --background-hover: rgba(0, 0, 0, 0.04);
    --border-radius: 50%;
  }

  .quran-modal-content {
    --background: #ffffff;
  }

  /* INDEKS BUKU SURAH */
  .quran-book-wrapper {
    padding: 24px 20px;
    animation: fadeIn 0.3s ease-out;
  }

  .quran-book-header {
    margin-bottom: 24px;
  }

  .quran-book-header h3 {
    font-size: 1.35rem;
    font-weight: 700;
    color: #1a202c;
    margin: 0 0 4px 0;
    letter-spacing: -0.02em;
  }

  .quran-book-header p {
    font-size: 0.9rem;
    color: #718096;
    margin: 0;
  }

  /* Grid Buku */
  .quran-surah-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  /* Tampilan halaman bacaan */
  .quran-reading-wrapper {
    animation: fadeIn 0.3s ease-out;
  }

  .quran-verses-wrapper {
    padding: 24px 20px 100px 20px;
    max-width: 680px;
    margin: 0 auto;
  }

  /* --- ANIMATIONS --- */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* --- DARK MODE --- */
  @media (prefers-color-scheme: dark) {
    .minimalist-header {
      --background: #121212;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
    }
    
    .minimalist-title {
      color: #f7fafc;
    }
    
    .minimalist-btn {
      --color: #a0aec0;
      --background-hover: rgba(255, 255, 255, 0.05);
    }

    .minimalist-btn-quran {
      --color: #63b3ed;
      --background-hover: rgba(99, 179, 237, 0.08);
    }
    
    .minimalist-btn-danger {
      --color: #feb2b2;
      --background-hover: rgba(254, 178, 178, 0.1);
    }

    .quran-modal-header {
      --background: #1a1a1a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .quran-close-btn, .quran-back-button {
      --color: #a0aec0;
    }

    .quran-modal-content {
      --background: #121212;
    }

    .quran-book-header h3 {
      color: #f7fafc;
    }

    .quran-book-header p {
      color: #a0aec0;
    }
  }
</style>
