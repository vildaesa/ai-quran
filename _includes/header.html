<ion-header class="ion-no-border minimalist-header">
  <ion-toolbar class="minimalist-toolbar">
    <ion-buttons slot="start">
      <ion-menu-button menu="chatHistoryMenu" class="minimalist-btn"></ion-menu-button>
    </ion-buttons>
    
    <ion-title id="chat-title" class="minimalist-title">{{ page.title }}</ion-title>
    
    <ion-buttons slot="end">
      <!-- TOMBOL BARU: Buka Al-Quran Digital -->
      <ion-button id="open-quran-btn" fill="clear" class="minimalist-btn-quran">
        <ion-icon slot="icon-only" name="book-outline"></ion-icon>
      </ion-button>
      
      <ion-button id="clear-current-chat-btn" fill="clear" class="minimalist-btn-danger">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- MODAL AL-QURAN DIGITAL (MODERN SWIPEABLE & FULLSCREEN ON MOBILE) -->
<ion-modal id="quran-modal" trigger="open-quran-btn" initial-breakpoint="1" breakpoints="[0, 0.5, 1]">
  <ion-header class="ion-no-border quran-modal-header">
    <ion-toolbar class="minimalist-toolbar">
      <ion-buttons slot="start">
        <ion-button id="close-quran-btn" fill="clear" class="quran-close-btn">
          <ion-icon slot="icon-only" name="close-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-title class="minimalist-title">Al-Quran Digital</ion-title>
    </ion-toolbar>
    
    <!-- Filter Seleksi Surah -->
    <div class="quran-selector-container">
      <div class="selector-wrapper">
        <label for="quran-surah-select">Pilih Surah:</label>
        <select id="quran-surah-select" class="quran-native-select">
          <option value="">Memuat surah...</option>
        </select>
      </div>
    </div>
  </ion-header>

  <ion-content class="quran-modal-content">
    <!-- Konten Ayat Al-Quran -->
    <div id="quran-verses-container" class="quran-verses-wrapper">
      <div class="quran-welcome-state">
        <ion-icon name="book-outline" class="quran-large-icon"></ion-icon>
        <h4>Selamat Datang di Al-Quran Digital</h4>
        <p>Silakan pilih Surah di bagian atas untuk mulai membaca, merenungi terjemahan, dan mendengarkan murottal ayat suci.</p>
      </div>
    </div>
  </ion-content>
</ion-modal>
