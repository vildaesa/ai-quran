<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="chatHistoryMenu"></ion-menu-button>
    </ion-buttons>
    <ion-title id="chat-title">{{ page.title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button id="clear-current-chat-btn" fill="clear">
        <ion-icon slot="icon-only" name="trash-outline" color="danger"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
