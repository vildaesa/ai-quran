<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'id' }}">
<head>
  <!-- Meta tag tambahan untuk mengoptimalkan safe-area & mencegah zooming tak sengaja di seluler -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  {% include head.html %}
  
  <style>
    /* --- OPTIMASI KINERJA LAYOUT --- */
    
    /* Mencegah lag transisi saat panel menu ditarik/geser */
    ion-split-pane {
      will-change: transform;
    }

    /* Mengunci area body utama agar tidak terjadi bounce scroll aneh di beberapa browser mobile */
    body {
      overscroll-behavior-y: contain;
      background: #fdfdfd;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #121212;
      }
    }
  </style>
</head>
<body>
  <ion-app>
    <!-- 
      Layout Split Pane dengan penargetan konten utama. 
      when="md" memastikan sidebar otomatis mengambang (floating/drawer) di ponsel, 
      dan melekat secara permanen di tablet/desktop.
    -->
    <ion-split-pane content-id="main-content" when="md">
      {% include sidebar.html %}

      <!-- CONTENT UTAMA CHAT -->
      <div class="ion-page" id="main-content">
        {{ content }}
      </div>
    </ion-split-pane>
  </ion-app>

  {% include scripts.html %}
</body>
</html>
