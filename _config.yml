title: AI Quran & Sholat Assistant
description: Islamic AI Assistant for Quran and Prayer guidance.
baseurl: "/ai-quran"
url: "https://vildaesa.github.io"
lang: "id_ID"

# Build settings
markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-dotenv

CLIENT_ID: "<%= ENV['CLIENT_ID'] %>"
# Firebase
API_KEY: "<%= ENV['API_KEY'] %>"
AUTH_DOMAIN: "<%= ENV['AUTH_DOMAIN'] %>"
PROJECT_ID: "<%= ENV['PROJECT_ID'] %>"
DATABASE_URL: "<%= ENV['DATABASE_URL'] %>"
STORAGE_BUCKET: "<%= ENV['STORAGE_BUCKET'] %>"
SENDER_ID: "<%= ENV['SENDER_ID'] %>"
APP_ID: "<%= ENV['APP_ID'] %>"

# Exclude from processing.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
